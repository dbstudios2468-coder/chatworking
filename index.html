<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Service Offline</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent: #FF3B30; /* iOS Red for offline status */
            --accent-glow: rgba(255, 59, 48, 0.3);
            --bg-color: #030508;
            --text-color: #ffffff;
            --font-main: 'Outfit', sans-serif;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: var(--font-main); 
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            height: 100dvh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        /* Deep-Fluid Background */
        #bg-canvas { 
            position: fixed; 
            inset: -10%; 
            z-index: -3; 
            background: radial-gradient(circle at 50% 50%, #111, var(--bg-color)); 
            filter: blur(50px) brightness(0.6); 
        }
        
        .ambient-mesh { 
            position: fixed; 
            inset: 0; 
            z-index: -2; 
            background: radial-gradient(circle at 50% 0%, var(--accent-glow), transparent 60%); 
            mix-blend-mode: screen; 
            pointer-events: none; 
            opacity: 0.5;
        }

        /* Glass Shutdown Card */
        .terminal-card { 
            background: rgba(255,255,255,0.03); 
            backdrop-filter: blur(50px) saturate(200%); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-top: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 50px; 
            padding: 70px 50px; 
            width: 90%;
            max-width: 500px; 
            text-align: center; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 2px 20px rgba(255,255,255,0.05); 
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
        }

        @keyframes slideUp { 
            0% { transform: translateY(40px) scale(0.95); opacity: 0; } 
            100% { transform: translateY(0) scale(1); opacity: 1; } 
        }

        .icon-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 59, 48, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            border: 1px solid rgba(255, 59, 48, 0.3);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .icon-container i {
            font-size: 2.5rem;
            color: var(--accent);
        }

        h1 { 
            font-weight: 900; 
            font-size: 2.5rem; 
            letter-spacing: -1px; 
            margin-bottom: 15px; 
            color: white; 
        }

        p { 
            opacity: 0.6; 
            font-size: 1.1rem; 
            line-height: 1.6;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div id="bg-canvas"></div>
    <div class="ambient-mesh"></div>

    <div class="terminal-card">
        <div class="icon-container">
            <i class="fas fa-power-off"></i>
        </div>
        <h1>Connection Closed</h1>
        <p>Sorry, this service is no longer available. The architecture has been taken offline.</p>
    </div>
</body>
</html>
